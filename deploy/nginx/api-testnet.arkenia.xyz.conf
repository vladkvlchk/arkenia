# Reverse proxy: api-testnet.arkenia.xyz → backend-v3 (pm2 arkenia-v3-api, :3002).
#
#   sudo cp deploy/nginx/api-testnet.arkenia.xyz.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/api-testnet.arkenia.xyz.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api-testnet.arkenia.xyz   # adds the TLS (443) server block
#
# The release backend mirrors this with a different port + server_name (api.arkenia.xyz).
# CORS is handled by the app (backend-v3 CORS_ORIGIN), not nginx.

server {
    server_name api-testnet.arkenia.xyz;

    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    listen 80;
}
