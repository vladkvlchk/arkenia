# Reverse proxy: api.arkenia.xyz → backend-v3 mainnet (pm2 arkenia-v3-api-mainnet, :3003).
#
# ⚠️ This REPLACES the V1 backend that currently serves api.arkenia.xyz (V1 pm2 :3001).
#    Stop/retire the V1 process (or move it to a subdomain) before switching this over.
#
#   sudo cp deploy/nginx/api.arkenia.xyz.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/api.arkenia.xyz.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.arkenia.xyz
#
# CORS is handled by the app (backend-v3 CORS_ORIGIN=https://arkenia.xyz), not nginx.

server {
    server_name api.arkenia.xyz;

    # Cover uploads go through here as multipart; the app caps them at 5 MiB (MAX_COVER_BYTES).
    # Without this, nginx's 1 MiB default 413s any real photo before it reaches the backend.
    client_max_body_size 8m;

    location / {
        proxy_pass         http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    listen 80;
}
