name: CI

on:
  push:
    # testnet included: it is the branch Vercel deploys the live demo from, and merges into it
    # were running no CI at all — a merge result nothing had built could reach production.
    branches: [main, dev, testnet]
  pull_request:

# One run per ref; cancel superseded runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job pins Node 22. On 20 the root install warned on each run:
#
#   npm warn EBADENGINE package: 'conventional-changelog-conventionalcommits@10.4.0'
#   npm warn EBADENGINE required: { node: '>=22' }, current: { node: 'v20.20.2' }
#
# commitlint's own dependencies require >=22, so a future release of them turns that warning into
# a hard failure — and because they install from the *root* lockfile, it would take down every
# job that runs `npm ci`, not just the commitlint one. Verified on 22 before bumping: contracts
# compile + 13 tests, backend-v3 build + 38 tests, frontend 405 tests + `next build`.
jobs:
  # The commit-msg hook is bypassable with --no-verify and does not run on GitHub's web editor,
  # so the convention is enforced here too. PR-only: the range below needs a base commit, and
  # `pull_request.base.sha` is empty on the push events this workflow also fires on.
  commits:
    name: commits · commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint walks a commit range; the default shallow clone has no range to walk.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # --no: run only the commitlint `npm ci` just installed. Without it npx will silently fetch
      # a copy from the registry if resolution misses, so CI could enforce a different version
      # than the lockfile pins — and it re-resolves against the registry either way, which is
      # where the last EBADENGINE line was coming from after the Node bump.
      - run: npx --no commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  contracts:
    name: contracts · hardhat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # Root install covers the npm workspaces (contracts / backend / frontend).
      - run: npm ci
      - run: npm run --workspace contracts compile
      - run: npm run --workspace contracts test

  frontend:
    name: frontend · next build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Static prerender initialises the Privy provider, which rejects an empty/invalid id.
      # Build-time only; this testnet id is already public (NEXT_PUBLIC_*, in .env.testnet.example).
      NEXT_PUBLIC_PRIVY_APP_ID: cmrb00jhv00fg0bjs2f93tph3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Hermetic: jsdom + mocked chain and API layers — no network, no RPC.
      - run: npm run --workspace frontend test
      # `next build` runs the type-check and lint; no env needed (config has mainnet defaults).
      - run: npm run --workspace frontend build

  backend-v3:
    name: backend-v3 · build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-v3/package-lock.json
      # Standalone package (own lockfile, not a workspace).
      - run: npm ci
      - run: npm run build
      # Hermetic: PGlite in-process — no external Postgres, no network.
      - run: npm test
